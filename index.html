<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1016" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one-column phone logbook — sticky date bar on top, six-tab bar fixed at the bottom; bumper-plate colors mark fuel bars and calendar dots. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#E7EBF2; --fg:#131823; --muted:#5A6476; --line:#D4DAE4;
  --accent:#2452D4; --accent-ink:#FFFFFF; --accent-soft:#E1E8FB;
  --ok:#1D7F47; --warn:#A86E12; --bad:#BF3328;
  --plate-red:#C8382C; --plate-blue:#2452D4; --plate-green:#2B8552; --plate-yellow:#C99700;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1016; --surface:#161B24; --surface-2:#1F2531; --fg:#E8ECF3; --muted:#97A2B5; --line:#2B3342;
  --accent:#7E9CFF; --accent-ink:#0D1016; --accent-soft:#1B2645;
  --ok:#4BC27E; --warn:#E3AA4C; --bad:#F06B5F;
  --plate-red:#F06B5F; --plate-blue:#7E9CFF; --plate-green:#4BC27E; --plate-yellow:#E8C04A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1016; --surface:#161B24; --surface-2:#1F2531; --fg:#E8ECF3; --muted:#97A2B5; --line:#2B3342;
  --accent:#7E9CFF; --accent-ink:#0D1016; --accent-soft:#1B2645;
  --ok:#4BC27E; --warn:#E3AA4C; --bad:#F06B5F;
  --plate-red:#F06B5F; --plate-blue:#7E9CFF; --plate-green:#4BC27E; --plate-yellow:#E8C04A;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:24px} h3{font-size:19px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin:0 auto;max-width:560px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.02em;margin-right:auto}
.datenav{display:flex;align-items:center;gap:2px}
.datenav button{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--fg);font-size:18px;cursor:pointer}
.datenav button:hover{background:var(--surface-2)}
.datelabel{font-weight:600;font-size:14px;min-width:96px;text-align:center}
.status{font-size:11.5px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font:600 14px/1 var(--font-body);cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:6px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.star{min-width:36px;padding:6px 8px;font-size:16px;color:var(--muted)}
.btn.star.on{color:var(--plate-yellow)}
.btn:focus-visible,.datenav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.chip:focus-visible,.cal button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;min-width:0}
textarea{width:100%;resize:vertical;min-height:60px;font-size:14px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 12px;font:600 13px/1 var(--font-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .today-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}

.session-name{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.pr{background:color-mix(in srgb,var(--plate-yellow) 22%,transparent);color:var(--fg);font-size:10.5px;padding:2px 5px;letter-spacing:.05em}

.bar{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px}
.track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .3s}
.bar .val{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.check span{flex:1}

.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-weight:600;font-size:15.5px}
.ex-meta{font-size:12.5px;color:var(--muted)}
.hint{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.hint.up{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hint.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.set .lbl{font-family:var(--font-display);font-size:18px;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1}
.set input{width:100%;text-align:center;font-variant-numeric:tabular-nums}
.set.done .lbl{color:var(--ok)}
.sethead{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) auto;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sethead span{text-align:center}
ol.whoop{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
ol.whoop li b{font-weight:600}
.sets-line{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;margin-top:2px}
.sets-line em{font-style:normal;color:var(--muted);font-size:12px;margin-right:3px}
.warm{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.ex-tools{display:flex;gap:6px;flex-wrap:wrap}

.food{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food .info{flex:1;min-width:0}
.food .info b{display:block;font-weight:600;font-size:14.5px}
.food .info small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.food .macro{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.formgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:6px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--muted);opacity:.55}
.chart .end{fill:var(--accent)}
.chart .area{fill:var(--accent);opacity:.08}
.chart .goal{stroke:var(--plate-green);stroke-dasharray:4 4;stroke-width:1.5}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button{border:1px solid transparent;background:var(--surface-2);border-radius:8px;min-height:46px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);font:600 13px/1 var(--font-body);cursor:pointer}
.cal button.today{border-color:var(--accent)}
.cal button:disabled{background:transparent;color:var(--muted);cursor:default;opacity:.55}
.cal .blank{min-height:46px}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:30px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.c-train{background:var(--plate-blue)} .c-run{background:var(--plate-green)} .c-stretch{background:var(--plate-yellow)} .c-cal{background:var(--plate-red)}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
.tablewrap{overflow-x:auto}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
details{border-top:1px solid var(--line);padding-top:10px}
details.plain{border-top:0;padding-top:0}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:8px 12px;font:600 13px/1 var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.stretch-item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.stretch-item:first-child{border-top:0}
.stretch-item b{font-weight:600}
.stretch-item small{grid-column:1/-1;color:var(--muted);font-size:13px}
.stretch-item.now{background:var(--accent-soft);margin:0 -14px;padding:10px 14px}
.player{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.player .big{font-family:var(--font-display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.player .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.player .track{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.player .fill{background:var(--bg);transition:none}
.player .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 0 10px;font:600 11px/1 var(--font-body);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

.timer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer-inner{max-width:560px;margin:0 auto 8px;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer-time{font-family:var(--font-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px}
.timer-inner .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.timer-prog{flex:1;height:6px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.timer-prog div{height:100%;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">LIFT LOG</div>
  <span class="status" id="status">On this phone</span>
  <div class="datenav">
    <button id="prev" aria-label="Previous day">‹</button>
    <div class="datelabel num" id="datelabel"></div>
    <button id="next" aria-label="Next day">›</button>
  </div>
</header>

<main class="wrap" id="view" style="padding-top:14px"></main>

<div class="timer" id="timer" hidden>
  <div class="timer-inner">
    <div class="timer-time" id="timer-time">0:00</div>
    <div class="timer-prog"><div id="timer-bar"></div></div>
    <button class="btn sm" id="timer-add">+30s</button>
    <button class="btn sm" id="timer-stop">Done</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<nav class="nav" aria-label="Sections">
  <div class="nav-inner">
    <button class="tab" data-view="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
    <button class="tab" data-view="train"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Train</button>
    <button class="tab" data-view="food"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M16 21V3c2.5 1 3.5 4 3.5 7s-1.5 4-3.5 4"/></svg>Food</button>
    <button class="tab" data-view="stretch"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8"/><path d="M4 9l8 1.5L20 9M12 10.5V15l-4 6M12 15l4 6"/></svg>Stretch</button>
    <button class="tab" data-view="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progress</button>
    <button class="tab" data-view="plan"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg>Plan</button>
  </div>
</nav>

<script>
/* ---------- program data ---------- */
const DAYS=["sun","mon","tue","wed","thu","fri","sat"];
const DAYNAME={mon:"Mon",tue:"Tue",wed:"Wed",thu:"Thu",fri:"Fri",sat:"Sat",sun:"Sun"};
const PLAN={
  mon:{label:"Upper",focus:"Strength",cool:"upper",ex:[
    {id:"smith-bench",n:"Smith machine bench press",s:4,lo:4,hi:6,r:180,rir:"1–2",inc:5},
    {id:"pulldown-wide",n:"Lat pulldown (wide grip, heavy)",s:4,lo:5,hi:8,r:180,rir:"1–2",inc:5},
    {id:"ohp",n:"Barbell overhead press",s:3,lo:5,hi:8,r:150,rir:"1–2",inc:5},
    {id:"cable-row",n:"Seated cable row",s:3,lo:6,hi:8,r:120,rir:"1",inc:5},
    {id:"bb-curl",n:"Barbell curl",s:3,lo:8,hi:12,r:90,rir:"0–1",inc:5},
    {id:"oh-tri",n:"Overhead cable triceps extension",s:3,lo:8,hi:12,r:90,rir:"0–1",inc:0}]},
  tue:{label:"Lower",focus:"Strength",cool:"lower",ex:[
    {id:"smith-squat",n:"Smith machine squat",s:4,lo:5,hi:8,r:180,rir:"1–2",inc:10},
    {id:"rdl",n:"Barbell Romanian deadlift",s:3,lo:6,hi:8,r:180,rir:"1–2",inc:10},
    {id:"leg-press",n:"Leg press",s:3,lo:8,hi:10,r:120,rir:"1",inc:10},
    {id:"leg-ext",n:"Seated leg extension",s:3,lo:10,hi:15,r:90,rir:"0–1",inc:5},
    {id:"back-ext",n:"Back extensions (weighted)",s:3,lo:8,hi:12,r:90,rir:"0–1",inc:5},
    {id:"calf-standing",n:"Standing calf raise",s:4,lo:8,hi:12,r:90,rir:"0–1",inc:10}]},
  wed:{label:"Run",focus:"Recovery",run:true,ex:[]},
  thu:{label:"Push",focus:"Size",cool:"upper",ex:[
    {id:"incline-smith",n:"Incline Smith machine press",s:4,lo:6,hi:8,r:180,rir:"1",inc:5},
    {id:"cable-fly",n:"Cable fly machine",s:4,lo:8,hi:12,r:120,rir:"0–1",inc:0},
    {id:"smith-shoulder",n:"Seated Smith machine shoulder press",s:3,lo:6,hi:10,r:120,rir:"1",inc:5},
    {id:"lat-raise",n:"Lateral raises",s:4,lo:12,hi:15,r:90,rir:"0–1",inc:0},
    {id:"oh-tri",n:"Overhead cable triceps extension",s:4,lo:10,hi:12,r:90,rir:"0–1",inc:0}]},
  fri:{label:"Pull",focus:"Size",cool:"upper",ex:[
    {id:"pulldown-close",n:"Lat pulldown (close/neutral grip)",s:4,lo:6,hi:10,r:180,rir:"1",inc:5},
    {id:"row-wide",n:"Wide-grip seated cable row",s:3,lo:8,hi:10,r:120,rir:"0–1",inc:5},
    {id:"row-single",n:"Single-arm cable row (each arm)",s:3,lo:10,hi:12,r:90,rir:"0–1",inc:0},
    {id:"lat-raise",n:"Lateral raises",s:3,lo:12,hi:15,r:90,rir:"0–1",inc:0},
    {id:"face-pull",n:"Face pulls",s:2,lo:12,hi:15,r:90,rir:"0–1",inc:0},
    {id:"ez-curl",n:"EZ-bar curl",s:3,lo:8,hi:10,r:90,rir:"0–1",inc:5},
    {id:"hammer-rope",n:"Cable rope hammer curl",s:2,lo:10,hi:12,r:90,rir:"0–1",inc:0}]},
  sat:{label:"Legs",focus:"Size",cool:"lower",ex:[
    {id:"leg-press",n:"Leg press",s:4,lo:6,hi:10,r:180,rir:"1",inc:10},
    {id:"bss",n:"Bulgarian split squat (each leg)",s:3,lo:6,hi:10,r:120,rir:"1",inc:5},

/* ---------- exercise logic ---------- */
function resolveEx(ex0){
  const sw=getS().swaps[ex0.id];if(!sw)return ex0;
  const alt=(ALTS[ex0.id]||[]).find(a=>a[0]===sw);if(!alt)return ex0;
  return Object.assign({},ex0,{id:alt[0],n:alt[1],inc:alt[2],orig:ex0.id});
}
function setsOf(w,id){return((w&&w.ex&&w.ex[id])||[]).filter(s=>s&&s.kg!=null&&s.r!=null&&s.r>0)}
function exHistory(id,before,skipDeload=true){return workouts().filter(w=>w.date<before&&!(skipDeload&&w.deload)&&setsOf(w,id).length).map(w=>({date:w.date,sets:setsOf(w,id)}))}
function topOf(sets){const top=Math.max(...sets.map(s=>s.kg));return{top,reps:sets.filter(s=>s.kg===top).map(s=>s.r)}}
function stalled(ex,before){
  const h=exHistory(ex.id,before).slice(0,3);if(h.length<3)return null;
  const t=h.map(x=>topOf(x.sets));
  if(!t.every(x=>x.top===t[0].top))return null;
  const sum=x=>x.reps.reduce((a,b)=>a+b,0);
  if(sum(t[0])>sum(t[2]))return null;
  return t[0].top;
}
function suggest(ex,last,wi){
  if(wi.deload){const kg=last?topOf(last.sets).top:null;return{cls:"warn",txt:kg!=null?`Deload: ${fmtKg(kg)} lbs, half the sets, stop 2–3 reps short.`:"Deload: normal weight, half the sets, stop 2–3 reps short.",kg}}
  if(!last)return{txt:`First time: pick a weight you can lift for ${ex.lo} reps with ${ex.rir} left in the tank.`,kg:null};
  const{top,reps}=topOf(last.sets);
  const hit=last.sets.length>=ex.s&&reps.length>=ex.s&&reps.every(r=>r>=ex.hi);
  if(hit){if(ex.inc>0){const nk=top+ex.inc;return{cls:"up",txt:`You hit ${ex.hi} reps on every set. Add weight: ${fmtKg(nk)} lbs.`,kg:nk}}
    return{cls:"up",txt:`You hit ${ex.hi} reps on every set. Move up one step on the stack or dumbbell.`,kg:null}}
  const st=stalled(ex,date);
  if(st!=null){const nk=r25(st*0.9);return{cls:"warn",txt:`Stuck at ${fmtKg(st)} lbs for 3 sessions. Drop to ${fmtKg(nk)} lbs and build back up. Check sleep and food too.`,kg:nk}}
  return{txt:`Stay at ${fmtKg(top)} lbs and beat ${reps.join(", ")} reps.`,kg:top};
}
function bestBefore(id,before){
  let kg=-1,reps=0,any=false;
  for(const w of workouts()){if(w.date>=before)continue;for(const s of setsOf(w,id)){any=true;if(s.kg>kg){kg=s.kg;reps=s.r}else if(s.kg===kg&&s.r>reps)reps=s.r}}
  return any?{kg,reps}:null;
}
function isPR(set,best,earlier){
  if(!best||set.kg==null||!set.r)return false;
  let kg=best.kg,reps=best.reps;
  for(const e of earlier){if(!e||e.kg==null||!e.r)continue;if(e.kg>kg){kg=e.kg;reps=e.r}else if(e.kg===kg&&e.r>reps)reps=e.r}
  return set.kg>kg||(set.kg===kg&&set.r>reps);
}

function exCard(ex0,i,count,k,w,wi){
  const ex=resolveEx(ex0);
  const sets=wi.deload?Math.ceil(ex.s/2):ex.s;
  const h=exHistory(ex.id,date);const last=h[0]||null;const sg=suggest(ex,last,wi);
  const cur=(w&&w.ex&&w.ex[ex.id])||[];
  const best=bestBefore(ex.id,date);
  const s=getS();const note=s.notes[ex.id]||"";
  const rows=Array.from({length:sets},(_,j)=>{
    const st=cur[j]||{};const done=st.kg!=null&&st.r;const pr=done&&isPR(st,best,cur.slice(0,j));
    const phKg=sg.kg!=null?fmtKg(sg.kg):"lbs";const phR=last&&last.sets[j]?last.sets[j].r:`${ex.lo}–${ex.hi}`;
    return `<div class="set ${done?"done":""}">
      <span class="lbl">${done?"✓":j+1}${pr?'<span class="tag pr">PR</span>':""}</span>
      <input inputmode="decimal" data-ex="${ex.id}" data-i="${j}" data-f="kg" placeholder="${phKg}" value="${st.kg??""}" aria-label="Set ${j+1} weight in lbs">
      <input inputmode="numeric" data-ex="${ex.id}" data-i="${j}" data-f="r" placeholder="${phR}" value="${st.r??""}" aria-label="Set ${j+1} reps">
      <button class="btn sm" data-rest="${ex.r}">Rest ${mmss(ex.r)}</button></div>`}).join("");
  let warm="";
  if(i===0){
    const work=num(cur[0]&&cur[0].kg)??sg.kg??(last?topOf(last.sets).top:null);
    warm=`<details class="plain" ${work?"open":""}><summary class="small">Warm-up sets</summary><div style="margin-top:8px">${work?`<div class="warm"><b>10 reps</b><span>${fmtKg(r25(work*.5))} lbs</span><b>5 reps</b><span>${fmtKg(r25(work*.7))} lbs</span><b>2–3 reps</b><span>${fmtKg(r25(work*.85))} lbs</span></div><div class="small muted" style="margin-top:6px">Based on ${fmtKg(work)} lbs. Rest about 1 min between them.</div>`:`<div class="small muted">Enter your set 1 weight and the warm-up weights appear here: 10 reps at 50%, 5 at 70%, 2–3 at 85%.</div>`}</div></details>`;
  } else warm=`<div class="small muted">Warm-up: 1 lighter set of 6–8 reps.</div>`;
  const alts=ALTS[ex0.id]||[];
  const swapUI=openSwap===ex0.id?`<select data-swap="${ex0.id}" aria-label="Choose exercise"><option value="">${esc(ex0.n)} (plan)</option>${alts.map(a=>`<option value="${a[0]}" ${s.swaps[ex0.id]===a[0]?"selected":""}>${esc(a[1])}</option>`).join("")}</select>`:"";
  return `<section class="card">
    <div class="ex-head"><div style="min-width:0"><div class="ex-name">${esc(ex.n)}</div><div class="ex-meta num">${sets} × ${ex.lo}–${ex.hi} · rest ${restTxt(ex.r)} · RIR ${wi.deload?"2–3":ex.rir}${ex.orig?" · swapped":""}</div></div><span class="eyebrow num">${i+1}/${count}</span></div>
    ${last?`<div class="small muted num">Last time (${short(last.date)}): ${last.sets.map(x=>`${fmtKg(x.kg)}×${x.r}`).join(", ")}</div>`:""}
    <div class="hint ${sg.cls||""}">${esc(sg.txt)}</div>
    ${warm}
    <div class="sethead"><span>Set</span><span>lbs</span><span>Reps</span><span></span></div>
    <div class="sets">${rows}</div>
    ${note&&openSwap!=="note:"+ex.id?`<div class="small"><span class="muted">Note:</span> ${esc(note)}</div>`:""}
    <div class="ex-tools">${alts.length?`<button class="btn sm ghost" data-swapopen="${ex0.id}">${openSwap===ex0.id?"Close":"Swap exercise"}</button>`:""}<button class="btn sm ghost" data-noteopen="${ex.id}">${openSwap==="note:"+ex.id?"Done":note?"Edit note":"Add note"}</button></div>
    ${swapUI}
    ${openSwap==="note:"+ex.id?`<textarea data-note="${ex.id}" placeholder="Seat height, grip, machine number…" aria-label="Note for ${esc(ex.n)}">${esc(note)}</textarea>`:""}

}

/* ---------- WHOOP summary ---------- */
function whoopRows(k,w){
  const rows=[],seen=new Set();if(!w)return rows;
  const add=(id,n)=>{if(seen.has(id))return;seen.add(id);const ss=((w.ex&&w.ex[id])||[]).filter(s=>s&&s.kg!=null&&s.r);if(ss.length)rows.push({n,ss})};
  PLAN[k].ex.forEach(e0=>{const ex=resolveEx(e0);add(ex.id,ex.n)});
  Object.keys(w.ex||{}).forEach(id=>add(id,EXNAME[id]||id));
  return rows;
}
function whoopText(k,w){
  const rows=whoopRows(k,w);
  return `${PLAN[k].label} · ${parse(date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}\n`+rows.map((r,i)=>`${i+1}. ${r.n}\n   ${r.ss.map(s=>`${fmtKg(s.kg)} lbs × ${s.r}`).join(", ")}`).join("\n");
}
function whoopHTML(k,w){
  const rows=whoopRows(k,w);
  if(!rows.length)return `<div class="empty">Log some sets above and they'll appear here, ready to copy into WHOOP.</div>`;
  const n=rows.reduce((a,r)=>a+r.ss.length,0);
  return `<div class="spread" style="margin-top:4px"><span class="eyebrow">For WHOOP Strength Trainer</span><span class="small muted num">${rows.length} exercises · ${n} sets</span></div>
  <ol class="whoop">${rows.map(r=>`<li><b>${esc(r.n)}</b><div class="sets-line num">${r.ss.map((s,j)=>`<span><em>Set ${j+1}</em> ${fmtKg(s.kg)} lbs × ${s.r}</span>`).join("")}</div></li>`).join("")}</ol>
  <button class="btn" data-whoopcopy="1">Copy as text</button>
  <p class="small muted">Open your matching routine in WHOOP's Strength Trainer and enter each set top to bottom. If WHOOP names an exercise differently, pick the closest match.</p>`;
}
function refreshWhoop(){const el=document.getElementById("whoop-sum");if(!el)return;const w=woDoc();const k=trainKey||(w&&w.session)||dayKey(date);el.innerHTML=whoopHTML(k,w)}
function copyText(t){
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"Copied":"Couldn't copy. Press and hold the list to select it instead.")};
  try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),fallback)}catch(e){fallback()}
}

/* ---------- stretch player ---------- */
let player=null,pInt=null;
function buildSteps(key){
  const steps=[];
  ROUTINES[key].items.forEach(([id,sec,sides,rounds],idx)=>{
    for(let r=1;r<=rounds;r++)for(const side of(sides?["Left","Right"]:[null]))
      steps.push({idx,id,sec,label:STR[id].n+(side?` · ${side}`:"")+(rounds>1?` · round ${r} of ${rounds}`:"")});
  });
  return steps;
}
function routineTime(key){const st=buildSteps(key);return Math.round((st.reduce((a,s)=>a+s.sec,0)+(st.length-1)*SWITCH)/60)}
function startRoutine(key){
  audioInit();
  player={key,steps:buildSteps(key),i:0,phase:"hold",end:0,left:0,paused:false};
  player.end=Date.now()+player.steps[0].sec*1000;
  view="stretch";clearInterval(pInt);pInt=setInterval(pTick,250);render();window.scrollTo(0,0);
}
function pTick(){
  if(!player||player.paused)return;
  const left=(player.end-Date.now())/1000;
  if(left<=0){
    if(player.phase==="hold"){
      if(player.i>=player.steps.length-1){finishRoutine();return}
      beep(1);player.phase="switch";player.end=Date.now()+SWITCH*1000;
    }else{player.i++;player.phase="hold";player.end=Date.now()+player.steps[player.i].sec*1000;beep(2)}
    if(view==="stretch")render();return;
  }
  const t=document.getElementById("p-time"),b=document.getElementById("p-bar");
  if(t)t.textContent=mmss(Math.ceil(left));
  if(b){const tot=player.phase==="hold"?player.steps[player.i].sec:SWITCH;b.style.width=(100-left/tot*100)+"%"}
}
function finishRoutine(){
  clearInterval(pInt);pInt=null;beep(3);
  const key=player.key;player=null;
  if(key==="daily"){const dd=clone(dayDoc(today()));dd.stretch=true;touch("d-"+today(),dd)}
  else{const dd=clone(dayDoc(today()));dd.cool=true;touch("d-"+today(),dd)}
  toast(key==="daily"?"Nice work. Stretch session logged.":"Cool-down done.");render();
}
function stopRoutine(){clearInterval(pInt);pInt=null;player=null;render()}

    </section>
    <section class="card"><h3>Up next</h3><div>${player.steps.slice(player.i+1,player.i+5).map(s=>`<div class="stretch-item"><b>${esc(s.label)}</b><span class="small muted num">${s.sec} s</span></div>`).join("")||`<p class="small muted">Last one.</p>`}</div></section>`;
  }

    <div class="spread"><h3>${R.n}</h3><span class="small muted num">about ${routineTime(key)} min</span></div>

    <button class="btn primary" data-startroutine="${key}">Start guided ${key==="daily"?"routine":"cool-down"}</button></section>`};
  const t=today();let streak=0;for(let i=0;i<60;i++){const d=dayDoc(addDays(t,-i));if(d.stretch)streak++;else if(i>0)break}
  const wkCount=[0,1,2,3,4,5,6].filter(i=>dayDoc(addDays(t,-i)).stretch).length;
  return `<section class="card">
    <div class="spread"><h3>Flexibility</h3><span class="small muted num">${wkCount} of 7 days this week</span></div>
    <label class="check"><input type="checkbox" id="stretchdone" ${dd.stretch?"checked":""}><span>Stretched ${fmtDate(date).toLowerCase()}</span></label>
    ${streak>1?`<div class="small num"><b>${streak}-day streak.</b> <span class="muted">Keep it going.</span></div>`:""}
  </section>
  ${rcard("daily")}${rcard("upper")}${rcard("lower")}
  <section class="card">
    <h3>How to get more flexible</h3>
    <ul class="clean small">
      <li>Stretch most days. Frequency matters more than one long session.</li>
      <li>Hold each stretch 30–60 seconds. No bouncing.</li>
      <li>Go to mild tension, about 5 out of 10, never pain. Breathe out and relax into it.</li>
      <li>Stretch when you're warm: after training, a walk or a shower.</li>
      <li>Lifting through the full range of motion builds flexibility too, so keep your reps deep and controlled.</li>
      <li>Expect clear progress in about 4–8 weeks of regular stretching.</li>
    </ul>
  </section>`;
}

/* ---------- progress ---------- */
function chartSvg(pts,opt={}){
  if(pts.length<2)return"";
  const W=340,H=170,L=34,R=10,Tp=10,B=22;
  const xs=pts.map(p=>parse(p.date).getTime()),ys=pts.map(p=>p.y).concat(opt.goal!=null&&opt.showGoal?[opt.goal]:[]);
  let y0=Math.min(...ys),y1=Math.max(...ys);if(y1-y0<2){y0-=1;y1+=1}
  const step=(y1-y0)>12?5:(y1-y0)>5?2:1;y0=Math.floor(y0/step)*step;y1=Math.ceil(y1/step)*step;
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const X=t=>L+(x1===x0?0.5:(t-x0)/(x1-x0))*(W-L-R),Y=v=>Tp+(1-(v-y0)/(y1-y0))*(H-Tp-B);
  let g="";for(let v=y0;v<=y1+1e-9;v+=step)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  const line=opt.line||pts;
  const d=line.map((p,i)=>`${i?"L":"M"}${X(parse(p.date).getTime()).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area=d+`L${X(parse(line[line.length-1].date).getTime()).toFixed(1)},${H-B}L${X(parse(line[0].date).getTime()).toFixed(1)},${H-B}Z`;
  const dots=opt.line?pts.map(p=>`<circle class="dot" cx="${X(parse(p.date).getTime())}" cy="${Y(p.y)}" r="2.5"/>`).join(""):"";
  const end=line[line.length-1];
  const goal=opt.goal!=null&&opt.showGoal?`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(opt.goal)}" y2="${Y(opt.goal)}"/>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||"Chart")}">${g}${goal}<path class="area" d="${area}"/><path class="line" d="${d}"/>${dots}<circle class="end" cx="${X(parse(end.date).getTime())}" cy="${Y(end.y)}" r="4.5"/>
  <text x="${L}" y="${H-5}">${short(pts[0].date)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${short(pts[pts.length-1].date)}</text></svg>`;
}
function calendar(){
  const[y,m]=calMonth.split("-").map(Number);const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();
  const lead=(first.getDay()+6)%7,t=today();
  let cells=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<lead;i++)cells+=`<div class="blank"></div>`;
  let n={train:0,run:0,stretch:0,cal:0};
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad(m)}-${pad(d)}`,dd=dayDoc(ds);
    const f={train:trained(ds),run:!!dd.run,stretch:!!dd.stretch,cal:kcalOf(dd)>=T.kcal*0.95};
    Object.keys(f).forEach(k=>{if(f[k])n[k]++});
    const dots=Object.keys(f).filter(k=>f[k]).map(k=>`<i class="c-${k}"></i>`).join("");
    cells+=`<button data-gotodate="${ds}" ${ds>t?"disabled":""} class="${ds===t?"today":""} num" aria-label="${ds}">${d}<span class="dots">${dots}</span></button>`;
  }
  const label=first.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  const atMax=calMonth>=t.slice(0,7);
  return `<section class="card">
    <div class="spread"><h3>${label}</h3><div class="row" style="gap:4px"><button class="btn sm ghost" data-cal="-1" aria-label="Previous month">‹</button><button class="btn sm ghost" data-cal="1" aria-label="Next month" ${atMax?"disabled":""}>›</button></div></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i class="c-train"></i>Trained ${n.train}</span><span><i class="c-run"></i>Ran ${n.run}</span><span><i class="c-stretch"></i>Stretched ${n.stretch}</span><span><i class="c-cal"></i>Calories hit ${n.cal}</span></div>
    <div class="small muted">Tap a day to open it.</div>
  </section>`;
}
function vProgress(){
  const s=bwSeries(),g=goalInfo();
  const roll=s.map(p=>{const from=addDays(p.date,-6);const win=s.filter(q=>q.date>=from&&q.date<=p.date);return{date:p.date,y:+avg(win.map(q=>q.kg)).toFixed(2)}});
  let advice="Log your weight 3–4 mornings a week. After two weeks you'll see your weekly rate here.",rate=g?g.rate:null;
  if(rate!=null)advice=rate<0.5?"Gaining less than 0.5 lbs a week. Add 200 kcal a day (300 ml whole milk, or a banana and 1 tbsp peanut butter).":
    rate>1.1?"Gaining more than 1 lb a week, which is mostly fat. Cut 200 kcal a day.":"On track: 0.5–1 lb a week. Keep calories where they are.";
  const bwBlock=s.length>=2?chartSvg(s.map(p=>({date:p.date,y:p.kg})),{line:roll,goal:T.goal,showGoal:g&&T.goal-g.cur<8,label:"Bodyweight over time with 7-day average"}):`<div class="empty">Your bodyweight chart appears after two weigh-ins. Log them on the Today tab.</div>`;
  const ws=workouts();
  const ids=[...new Set(ws.flatMap(w=>Object.keys(w.ex||{}).filter(id=>setsOf(w,id).length)))];
  if(!liftSel||!ids.includes(liftSel))liftSel=ids[0]||null;
  let liftBlock=`<div class="empty">Log a workout on the Train tab and your lifts will chart here.</div>`;
  if(liftSel){
    const hist=ws.filter(w=>setsOf(w,liftSel).length).map(w=>{const t=topOf(setsOf(w,liftSel));return{date:w.date,y:t.top,reps:t.reps,del:w.deload}}).reverse();
    const best=hist.reduce((b,h)=>!b||h.y>b.y||(h.y===b.y&&Math.max(...h.reps)>Math.max(...b.reps))?h:b,null);
    liftBlock=`<select id="liftsel" aria-label="Exercise">${ids.map(id=>`<option value="${id}" ${id===liftSel?"selected":""}>${esc(EXNAME[id]||id)}</option>`).join("")}</select>
    ${best?`<div class="small num">Best: <b>${fmtKg(best.y)} lbs × ${Math.max(...best.reps)}</b> <span class="muted">(${short(best.date)})</span></div>`:""}
    ${hist.length>=2?chartSvg(hist,{label:"Top set weight per session"}):""}
    <div class="tablewrap"><table class="num"><thead><tr><th>Date</th><th>Top set</th><th>Reps at top weight</th></tr></thead><tbody>
    ${hist.slice().reverse().slice(0,8).map(h=>`<tr><td>${short(h.date)}${h.del?' <span class="muted">(deload)</span>':""}</td><td>${fmtKg(h.y)} lbs</td><td>${h.reps.join(", ")}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return `
  <section class="card">
    <h3>Bodyweight goal</h3>
    <div class="stats">
      <div class="stat"><b>${g?g.cur.toFixed(1):"—"}</b><span>lbs now (7-day avg)</span></div>
      <div class="stat"><b>${rate!=null?(rate>=0?"+":"")+rate.toFixed(2):"—"}</b><span>lbs this week</span></div>
      <div class="stat"><b>${g?g.left.toFixed(1):"—"}</b><span>lbs to ${T.goal}</span></div>
    </div>
    ${g?goalBar(g)+`<div class="small muted">${g.eta?`At this pace you reach ${T.goal} lbs around <b style="color:var(--fg)">${g.eta}</b>.`:"Your finish date appears once you're gaining steadily."}</div>`:""}
    ${bwBlock}
    <div class="hint ${rate!=null&&rate>=0.5&&rate<=1.1?"":"up"}">${advice}</div>
  </section>
  ${calendar()}
  <section class="card"><h3>Lifts</h3>${liftBlock}</section>`;
}

function vPlan(){
  const s=getS(),wi=weekInfo(today());
  const wk=["mon","tue","wed","thu","fri","sat","sun"].map(d=>`<tr><td><b>${DAYNAME[d]}</b></td><td>${PLAN[d].label}</td><td class="muted">${PLAN[d].focus}${PLAN[d].ex.length?` · ${PLAN[d].ex.length} exercises`:""}</td></tr>`).join("");
  const lb=lastBackup();
  return `
  <section class="card">
    <div class="spread"><h3>Program cycle</h3><span class="tag ${wi.deload?"warn":""}">${weekLabel(wi)}</span></div>
    <p class="small muted">6 normal weeks, then 1 deload week, then repeat. Week numbers count from your start date.</p>
    <div class="row"><label class="small" for="startdate" style="margin-right:auto">Program started</label><input type="date" id="startdate" value="${programStart()}" max="${today()}"></div>
    <div class="row"><span class="small" style="margin-right:auto">This week</span>
      <div class="seg" role="group" aria-label="This week"><button data-deload="0" aria-pressed="${!wi.deload}">Normal</button><button data-deload="1" aria-pressed="${wi.deload}">Deload</button></div></div>
    ${!wi.auto?`<button class="btn sm ghost" data-deload="auto" style="align-self:flex-start">Back to automatic schedule</button>`:""}
    <p class="small muted">Deload early if your joints ache, strength drops for 2 weeks, or you sleep badly for several nights.</p>
  </section>
  <section class="card"><h3>Week</h3><div class="tablewrap"><table>${wk}</table></div></section>
  <section class="card">
    <h3>Daily targets</h3>
    <div class="tablewrap"><table class="num">
      <tr><td>Calories</td><td><b>~3,100 kcal</b></td></tr>
      <tr><td>Protein</td><td><b>120–140 g</b> (4–5 meals, 25–40 g each)</td></tr>
      <tr><td>Carbs / fat</td><td>400–450 g / 80–100 g</td></tr>
      <tr><td>Water</td><td>2.25–2.5 L, plus ~0.5 L per hour of training</td></tr>
      <tr><td>Gain rate</td><td>0.5–1 lb a week (weekly average)</td></tr>
      <tr><td>Sleep</td><td>8–9 hours, same times every day</td></tr>
    </table></div>
  </section>
  <section class="card">
    <details open><summary>How to add weight</summary>
      <ul class="clean small" style="margin-top:8px">
        <li>Start at the bottom of the rep range. Add reps each session.</li>
        <li>When every set hits the top of the range, add weight next time: 5 lbs upper body, 10 lbs legs, one step on cables. The Train tab tells you when.</li>
        <li>Heavy strength lifts: stop with 1–2 reps left. Everything else: 0–1 left.</li>
        <li>Stuck for 3 sessions: drop 10% and build back up. The Train tab spots this for you.</li>
      </ul></details>
    <details><summary>Supplements</summary>
      <ul class="clean small" style="margin-top:8px">
        <li><b>Creatine monohydrate:</b> 3–5 g every day, rest days too. No loading needed.</li>
        <li><b>Whey protein:</b> 1–2 scoops when food doesn't reach your protein target.</li>
        <li><b>Vitamin D3:</b> 1,000–2,000 IU daily, October to March.</li>
        <li><b>Magnesium:</b> 200–300 mg of elemental magnesium in the evening, as glycinate or citrate. Stay at or under 350 mg a day from supplements; your food covers the rest.</li>
        <li><b>Optional:</b> caffeine ~200 mg before training (not within 6 h of bed); fish oil if you eat oily fish less than twice a week.</li>
        <li><b>Skip:</b> BCAAs, mass gainers, testosterone boosters, glutamine, fat burners, SARMs and steroids.</li>
      </ul></details>
  </section>
  <section class="card">
    <h3>Backup</h3>
    <p class="small muted">Your logs live on this phone only. Save a backup every couple of weeks, and before switching phones.${lb?` Last backup: ${short(lb)}.`:" No backup yet."}</p>
    <div class="row"><button class="btn primary" data-backup="export">Save backup</button>
      <label class="btn" for="restore" style="display:inline-flex;align-items:center">Restore from file</label>
      <input type="file" id="restore" accept="application/json,.json" hidden></div>
  </section>`;
}

/* ---------- events ---------- */
document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;view=b.dataset.view;openSwap=null;render();window.scrollTo(0,0)});
$("#prev").addEventListener("click",()=>{date=addDays(date,-1);trainKey=null;render()});
$("#next").addEventListener("click",()=>{if(date<today()){date=addDays(date,1);trainKey=null;render()}});

const V=$("#view");
V.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const D=t.dataset;
  if(D.go){view=D.go;render();window.scrollTo(0,0);return}
  if(D.water){const dd=clone(dayDoc());dd.water=Math.max(0,(dd.water||0)+Number(D.water));touch("d-"+date,dd);render();return}
  if(D.session){trainKey=D.session;openSwap=null;whoopOpen=false;render();return}
  if(D.cat){foodCat=D.cat;render();return}
  if(D.add){const f=LIB[+D.add];const dd=clone(dayDoc());dd.items.push({n:f.n,k:f.k,p:f.p});touch("d-"+date,dd);render();toast(`Added ${f.n}`);return}
  if(D.favlib){toggleFav(LIB[+D.favlib]);render();return}
  if(D.favitem){toggleFav(dayDoc().items[+D.favitem]);render();return}
  if(D.del){const dd=clone(dayDoc());dd.items.splice(+D.del,1);touch("d-"+date,dd);render();return}
  if(D.copy){const y=dayDoc(addDays(date,-1));const dd=clone(dayDoc());dd.items=dd.items.concat(clone(y.items));touch("d-"+date,dd);render();toast(`Copied ${y.items.length} foods`);return}
  if(D.rest){startTimer(+D.rest);return}
  if(D.backup){exportBackup();return}
  if(D.swapopen){openSwap=openSwap===D.swapopen?null:D.swapopen;render();return}
  if(D.noteopen){openSwap=openSwap==="note:"+D.noteopen?null:"note:"+D.noteopen;render();if(openSwap){const ta=V.querySelector(`textarea[data-note="${D.noteopen}"]`);ta&&ta.focus()}return}
  if(D.whoop){whoopOpen=!whoopOpen;render();if(whoopOpen){const el=document.getElementById("whoop-sum");el&&el.scrollIntoView&&el.scrollIntoView({behavior:"smooth",block:"start"})}return}
  if(D.whoopcopy){const w=woDoc();const k=trainKey||(w&&w.session)||dayKey(date);copyText(whoopText(k,w));return}
  if(D.startroutine){startRoutine(D.startroutine);return}
  if(D.p){if(!player)return;
    if(D.p==="pause"){if(player.paused){player.paused=false;player.end=Date.now()+player.left*1000}else{player.paused=true;player.left=Math.max(0,(player.end-Date.now())/1000)}render()}
    else if(D.p==="skip"){if(player.i>=player.steps.length-1){finishRoutine();return}player.i++;player.phase="hold";player.paused=false;player.end=Date.now()+player.steps[player.i].sec*1000;render()}
    else stopRoutine();return}
  if(D.unit){if(D.unit==="kg")convertLifts();setS(s=>{s.unit="lb"});render();toast(D.unit==="kg"?"Converted your earlier lifts to pounds":"Got it, nothing changed");return}
  if(D.gotodate){date=D.gotodate;view="today";trainKey=null;render();window.scrollTo(0,0);return}
  if(D.cal){const[y,m]=calMonth.split("-").map(Number);const d=new Date(y,m-1+Number(D.cal),1);calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render();return}
  if(D.deload){const mon=mondayOf(today());setS(s=>{s.deload=Object.assign({},s.deload);if(D.deload==="auto")delete s.deload[mon];else s.deload[mon]=D.deload==="1"});render();return}
});
V.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="run"){const dd=clone(dayDoc());dd.run=t.checked;touch("d-"+date,dd);return}
  if(t.id==="stretchdone"){const dd=clone(dayDoc());dd.stretch=t.checked;touch("d-"+date,dd);return}
  if(t.dataset.supp){const dd=clone(dayDoc());dd.supps=Object.assign({},dd.supps,{[t.dataset.supp]:t.checked});touch("d-"+date,dd);return}
  if(t.id==="liftsel"){liftSel=t.value;render();return}
  if(t.id==="restore"&&t.files&&t.files[0]){importBackup(t.files[0]);t.value="";return}
  if(t.id==="awake"){setS(s=>{s.awake=t.checked});updateWake();return}
  if(t.id==="startdate"){if(t.value&&t.value<=today()){setS(s=>{s.start=t.value});render();toast("Start date saved")}return}
  if(t.dataset.swap){const id=t.dataset.swap,v=t.value;setS(s=>{s.swaps=Object.assign({},s.swaps);if(v)s.swaps[id]=v;else delete s.swaps[id]});openSwap=null;render();toast(v?"Exercise swapped. Its history is tracked separately.":"Back to the plan exercise");return}
  if(t.dataset.ex){checkPR(t)}
});
V.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.note){const id=t.dataset.note,v=t.value.slice(0,300);setS(s=>{s.notes=Object.assign({},s.notes);if(v.trim())s.notes[id]=v;else delete s.notes[id]},600);return}
  if(!t.dataset.ex)return;
  const k=trainKey||(woDoc()&&woDoc().session)||dayKey(date);
  let w=woDoc();w=w?clone(w):{date,session:k,ex:{}};
  w.session=k;w.ex=w.ex||{};w.deload=weekInfo().deload;
  const arr=w.ex[t.dataset.ex]=w.ex[t.dataset.ex]||[];
  const i=+t.dataset.i;for(let j=0;j<=i;j++)arr[j]=arr[j]||{kg:null,r:null};
  const v=num(t.value);arr[i][t.dataset.f]=t.dataset.f==="r"?(v!=null?Math.round(v):null):v;
  touch("w-"+date,w,500);refreshWhoop();
  const row=t.closest(".set"),s=arr[i],done=s.kg!=null&&s.r;row.classList.toggle("done",!!done);
  const lbl=row.querySelector(".lbl");const pr=lbl.querySelector(".pr");lbl.firstChild.textContent=done?"✓":i+1;
  if(!done&&pr)pr.remove();
});
function checkPR(t){
  const id=t.dataset.ex,i=+t.dataset.i,w=woDoc();if(!w)return;
  const arr=(w.ex&&w.ex[id])||[],s=arr[i];if(!s||s.kg==null||!s.r)return;
  const best=bestBefore(id,date);const row=t.closest(".set"),lbl=row.querySelector(".lbl");
  const pr=isPR(s,best,arr.slice(0,i));const tag=lbl.querySelector(".pr");
  if(pr&&!tag)lbl.insertAdjacentHTML("beforeend",'<span class="tag pr">PR</span>');
  if(!pr&&tag)tag.remove();
  const key=`${date}|${id}|${i}|${s.kg}|${s.r}`;
  if(pr&&!prShown.has(key)){prShown.add(key);toast(`New personal record: ${fmtKg(s.kg)} lbs × ${s.r} on ${EXNAME[id]||"this lift"}`);beep(3)}
}
V.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="bwform"){const v=num($("#bw").value);if(v==null||v<70||v>550){toast("Enter your weight in pounds, like 142.4");return}
    const dd=clone(dayDoc());dd.bw=Math.round(v*10)/10;touch("d-"+date,dd);$("#bw").blur();render();toast("Weight saved")}
  if(e.target.id==="custom"){const n=$("#cn").value.trim(),k=num($("#ck").value),p=num($("#cp").value)??0;
    if(!n||k==null){toast("Add a name and the calories");return}
    const dd=clone(dayDoc());dd.items.push({n:n.slice(0,80),k:Math.round(k),p:Math.round(p)});touch("d-"+date,dd);document.activeElement&&document.activeElement.blur();render();toast(`Added ${n}`)}
});

/* ---------- sound + rest timer ---------- */
let actx=null;
function audioInit(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function beep(n=3){try{audioInit();for(let k=0;k<n;k++){const o=k*.25,g=actx.createGain(),osc=actx.createOscillator();osc.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.18);osc.connect(g).connect(actx.destination);osc.start(actx.currentTime+o);osc.stop(actx.currentTime+o+.2)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(n>=3?[200,100,200]:[150])}catch(e){}}
let tEnd=0,tTotal=0,tInt=null;
function startTimer(sec){audioInit();tTotal=sec;tEnd=Date.now()+sec*1000;$("#timer").hidden=false;clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const left=Math.max(0,(tEnd-Date.now())/1000);$("#timer-time").textContent=mmss(Math.ceil(left));$("#timer-bar").style.width=(100-left/tTotal*100)+"%";
  if(left<=0){clearInterval(tInt);tInt=null;$("#timer-time").textContent="Go";beep(3);setTimeout(()=>{if(!tInt)$("#timer").hidden=true},4000)}}
$("#timer-add").addEventListener("click",()=>{if(!tInt){startTimer(30);return}tEnd+=30000;tTotal+=30});
$("#timer-stop").addEventListener("click",()=>{clearInterval(tInt);tInt=null;$("#timer").hidden=true});

/* ---------- boot ---------- */
localLoad();migrateBodyweight();if(!needsUnitAsk()&&getS().unit!=="lb")setS(s=>{s.unit="lb"});render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
